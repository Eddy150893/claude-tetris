name: Claude Issue Triage

on:
  issues:
    types: [opened, edited]

concurrency:
  group: issue-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: github.event.issue.pull_request == null && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Triage issue with Claude
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Read,Glob,Grep,Write,Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh label list:*)"'
          prompt: |
            Repositorio: ${{ github.repository }}
            Issue: #${{ github.event.issue.number }}
            Evento: ${{ github.event.action }} (opened = nuevo, edited = título/cuerpo editado)

            Tu tarea es hacer triage de este issue. NO modifiques código del repo ni abras PRs.

            1. Lee el issue: `gh issue view ${{ github.event.issue.number }} --json title,body,labels,author`.
               Lee CLAUDE.md y el código relevante (game.js, index.html, style.css) para basar el diagnóstico en el código real.

            2. Labels: ejecuta `gh label list` y elige SOLO labels que ya existan. NO crees labels nuevos.
               Aplica con `gh issue edit ${{ github.event.issue.number }} --add-label "a,b"`.
               Si el evento es `edited`, quita con `--remove-label` los labels que ya no apliquen.

            3. Diagnóstico: escribe el comentario en /tmp/diagnostico.md y publícalo con
               `gh issue comment ${{ github.event.issue.number }} --edit-last --create-if-none --body-file /tmp/diagnostico.md`
               (así se mantiene un único comentario que se actualiza en cada edición).

            Formato del comentario (markdown, en español). Primera línea exacta: `<!-- claude-issue-triage -->`
            Secciones:
            - **Resumen**: qué se reporta/solicita.
            - **Tipo y labels**: labels asignados con razón breve.
            - **Área afectada**: archivos y funciones (ej. `game.js` → `clearLines`, `tryRotate`, `collide`).
            - **Causa probable** (bugs) o **Análisis del requerimiento** (features).
            - **Enfoque de solución propuesto**: pasos concretos de implementación.
            - **Criterios de aceptación / cómo verificar**.
            - **Riesgos y preguntas abiertas**: info faltante en el issue.
            - **Complejidad estimada**: baja / media / alta.

            El diagnóstico será usado luego por el equipo para implementar la solución; sé concreto y técnico.
